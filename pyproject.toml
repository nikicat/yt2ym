[project]
name = "yt2ym"
version = "0.1.0"
description = "Download YouTube (or any yt-dlp-supported site) audio with chapter splitting and upload to Yandex Music"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "asyncclick>=8.3.0.7",
    "mutagen>=1.47.0",
    "yandex-music>=2,<4",
]

[project.scripts]
yt2ym = "yt2ym:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["yt2ym.py"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pyright]
venvPath = "."
venv = ".venv"
reportPrivateImportUsage = "none"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
