[project]
name = "yt2ym"
version = "0.1.0"
description = "Download YouTube (or any yt-dlp-supported site) audio with chapter splitting and upload to Yandex Music"
requires-python = ">=3.15"
dependencies = [
    "aiohttp>=3.14.5",
    "asyncclick>=8.4.2.1",
    "mutagen>=1.48.1",
    "pydantic>=2.14.3",
    "yandex-music[async]>=3.2.2,<4",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
yt2ym = "yt2ym.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "zizmor>=1.32.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportPrivateImportUsage = "none"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
